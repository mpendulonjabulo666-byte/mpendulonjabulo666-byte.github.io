<style>
  :root{
    --night:#17101A;
    --gold:#C9A24B;
    --gold-hi:#E7CE93;
    --cream:#F6EFE3;
    --cream-dim:#C9BEB2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  @page{size:A4;margin:0}
  html,body{width:210mm;height:297mm}
  body{
    font-family:'Jost',sans-serif;
    background:var(--night);
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  .page{
    position:relative;width:210mm;height:297mm;overflow:hidden;
    display:flex;flex-direction:column;
  }

  /* arabesque tile, sitting well back so type stays the loudest thing */
  .pattern{
    position:absolute;inset:0;opacity:.09;z-index:0;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23C9A24B%22%20stroke-width%3D%221.6%22%3E%3Cpath%20d%3D%22M50.00%2C24.00L57.62%2C31.62L68.38%2C31.62L68.38%2C42.38L76.00%2C50.00L68.38%2C57.62L68.38%2C68.38L57.62%2C68.38L50.00%2C76.00L42.38%2C68.38L31.62%2C68.38L31.62%2C57.62L24.00%2C50.00L31.62%2C42.38L31.62%2C31.62L42.38%2C31.62Z%20M0.00%2C-26.00L7.62%2C-18.38L18.38%2C-18.38L18.38%2C-7.62L26.00%2C0.00L18.38%2C7.62L18.38%2C18.38L7.62%2C18.38L0.00%2C26.00L-7.62%2C18.38L-18.38%2C18.38L-18.38%2C7.62L-26.00%2C0.00L-18.38%2C-7.62L-18.38%2C-18.38L-7.62%2C-18.38Z%20M0.00%2C74.00L7.62%2C81.62L18.38%2C81.62L18.38%2C92.38L26.00%2C100.00L18.38%2C107.62L18.38%2C118.38L7.62%2C118.38L0.00%2C126.00L-7.62%2C118.38L-18.38%2C118.38L-18.38%2C107.62L-26.00%2C100.00L-18.38%2C92.38L-18.38%2C81.62L-7.62%2C81.62Z%20M100.00%2C-26.00L107.62%2C-18.38L118.38%2C-18.38L118.38%2C-7.62L126.00%2C0.00L118.38%2C7.62L118.38%2C18.38L107.62%2C18.38L100.00%2C26.00L92.38%2C18.38L81.62%2C18.38L81.62%2C7.62L74.00%2C0.00L81.62%2C-7.62L81.62%2C-18.38L92.38%2C-18.38Z%20M100.00%2C74.00L107.62%2C81.62L118.38%2C81.62L118.38%2C92.38L126.00%2C100.00L118.38%2C107.62L118.38%2C118.38L107.62%2C118.38L100.00%2C126.00L92.38%2C118.38L81.62%2C118.38L81.62%2C107.62L74.00%2C100.00L81.62%2C92.38L81.62%2C81.62L92.38%2C81.62Z%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%227%22%20/%3E%3C/g%3E%3C/svg%3E");background-repeat:repeat;background-size:26mm 26mm;
  }

  /* ---------- hero ---------- */
  .hero{position:relative;z-index:1;display:block;width:210mm;height:76mm;object-fit:cover}
  .hairline{position:relative;z-index:1;height:1.2mm;background:var(--gold)}

  .inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:11mm 22mm 0}

  /* ---------- masthead ---------- */
  .eyebrow{
    font-size:3.2mm;font-weight:500;letter-spacing:.52em;text-transform:uppercase;
    color:var(--gold);text-align:center;
  }
  .wordmark{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:23mm;line-height:1;letter-spacing:.055em;text-transform:uppercase;
    text-align:center;margin-top:5mm;color:var(--cream);
  }
  .arabic{
    font-family:'Noto Naskh Arabic',serif;direction:rtl;
    font-size:6.4mm;line-height:1.6;text-align:center;margin-top:2.5mm;color:var(--gold-hi);
  }

  /* ---------- the three tiles ---------- */
  .tiles{display:flex;gap:5mm;margin-top:9mm}
  figure{flex:1;text-align:center}
  figure img{display:block;width:100%;height:55mm;object-fit:cover;border:.35mm solid rgba(201,162,75,.45)}
  figcaption b{
    display:block;margin-top:4mm;font-family:'Cormorant Garamond',serif;
    font-size:6.4mm;font-weight:600;line-height:1;color:var(--cream);
  }
  figcaption span{
    display:block;margin-top:2mm;font-size:2.9mm;font-weight:300;line-height:1.5;
    letter-spacing:.06em;color:var(--cream-dim);
  }

  /* ---------- offer strip ---------- */
  .offer{
    display:flex;margin-top:9mm;
    border-top:.35mm solid rgba(201,162,75,.32);border-bottom:.35mm solid rgba(201,162,75,.32);
  }
  .offer div{flex:1;text-align:center;padding:4.5mm 3mm}
  .offer div + div{border-left:.35mm solid rgba(201,162,75,.32)}
  .offer strong{
    display:block;font-size:2.8mm;font-weight:500;letter-spacing:.28em;
    text-transform:uppercase;color:var(--gold);
  }
  .offer span{display:block;margin-top:2mm;font-size:3.4mm;font-weight:300;color:var(--cream)}

  /* ---------- contact ---------- */
  .contact{
    margin-top:auto;margin-left:-22mm;margin-right:-22mm;
    background:var(--gold);color:#20160C;
    padding:6.5mm 22mm 6mm;text-align:center;
  }
  .contact .label{
    font-size:2.9mm;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:#4A3413;
  }
  .phone{
    font-family:'Cormorant Garamond',serif;font-weight:700;
    font-size:14mm;line-height:1;letter-spacing:.02em;margin-top:2.5mm;
  }
  .where{
    margin-top:3mm;font-size:3.3mm;font-weight:400;letter-spacing:.1em;color:#3A2A10;
  }
  .ph{border-bottom:.4mm dashed rgba(32,22,12,.5);padding-bottom:.4mm}
  .ph-dark{color:var(--gold-hi);border-bottom:.4mm dashed rgba(231,206,147,.5)}
</style>
</head>
