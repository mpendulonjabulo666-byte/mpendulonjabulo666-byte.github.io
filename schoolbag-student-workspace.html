<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace — SchoolBag</title>
<style>
  :root{
    --bg:#FBF1E3;
    --card:#FFFFFF;
    --border:#ECE0CC;
    --accent:#8B5A2C;
    --accent-soft:#F0D9A6;
    --text:#1C1A16;
    --muted:#8D8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .app{max-width:480px;margin:0 auto;padding:20px 20px 48px;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
  .back-btn{
    width:36px;height:36px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--text);
    text-decoration:none;box-shadow:0 1px 3px rgba(28,26,22,0.08);flex-shrink:0;
  }
  .topbar-title{font-size:17px;font-weight:700;}

  .feature{flex:1;display:flex;flex-direction:column;align-items:flex-start;}
  .feature-icon{
    width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  }
  .feature h1{font-size:22px;margin:0 0 10px;}
  .soon-badge{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:5px 10px;border-radius:6px;margin-bottom:16px;
  }
  .feature p{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 28px;max-width:38ch;}

  .primary-btn{
    display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:700;font-size:15px;padding:14px 22px;border-radius:12px;
  }

  .footer-nav{margin-top:auto;padding-top:32px;text-align:center;}
  .footer-nav a{color:var(--muted);font-size:12.5px;text-decoration:none;margin:0 8px;}
  .footer-nav a:hover{text-decoration:underline;}

  svg{display:block;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back-btn" href="schoolbag-dashboard-student.html" aria-label="Back to dashboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-title">Workspace</div>
  </div>

  <div class="feature">
    <div class="feature-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </div>
    <span class="soon-badge">Coming soon</span>
    <h1>Workspace</h1>
    <p>Your notes, uploads, and generated study material in one editable space.</p>
    <a class="primary-btn" href="schoolbag-dashboard-student.html">Back to dashboard</a>
  </div>

  <div class="footer-nav">
    <a href="schoolbag-dashboard-student.html">Dashboard</a>&middot;
    <a href="schoolbag-terms.html">Terms</a>&middot;
    <a href="schoolbag-privacy.html">Privacy</a>
  </div>

</div>
</body>
</html>
