<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradebook — SchoolBag</title>
<style>
  :root{
    --bg:#FBF1E3;
    --card:#FFFFFF;
    --border:#ECE0CC;
    --accent:#8B5A2C;
    --accent-soft:#F0D9A6;
    --text:#1C1A16;
    --muted:#8D8578;
    --pass:#2F9E44;
    --pass-soft:#DFF0E2;
    --fail:#B5502E;
    --fail-soft:#F6DFD3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .app{max-width:480px;margin:0 auto;padding:20px 20px 40px;min-height:100vh;display:flex;flex-direction:column;}

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .back-btn{
    width:36px;height:36px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--text);
    text-decoration:none;box-shadow:0 1px 3px rgba(28,26,22,0.08);flex-shrink:0;border:none;cursor:pointer;
  }
  .topbar-text{flex:1;min-width:0;}
  .topbar-title{font-size:17px;font-weight:700;line-height:1.2;}
  .topbar-sub{font-size:12px;color:var(--muted);margin-top:1px;}

  /* ---- class list ---- */
  .class-list{display:flex;flex-direction:column;gap:12px;}
  .class-card{
    display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--border);border-radius:16px;padding:14px 16px;
    text-align:left;width:100%;font-family:inherit;cursor:pointer;
  }
  .class-icon{
    width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:14px;
  }
  .class-info{flex:1;min-width:0;}
  .class-title{font-weight:700;font-size:15px;margin-bottom:2px;}
  .class-meta{font-size:12.5px;color:var(--muted);}
  .ungraded-badge{
    font-size:11px;font-weight:700;color:var(--fail);background:var(--fail-soft);
    padding:3px 8px;border-radius:6px;flex-shrink:0;white-space:nowrap;
  }
  .ungraded-badge.clear{color:var(--pass);background:var(--pass-soft);}
  .chev{color:var(--muted);width:16px;height:16px;flex-shrink:0;}

  /* ---- gradebook detail ---- */
  .detail{display:none;flex-direction:column;flex:1;}
  .detail.active{display:flex;}
  .class-list.hidden{display:none;}

  .stat-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat-chip{
    flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;
  }
  .stat-chip strong{display:block;font-size:18px;line-height:1.1;}
  .stat-chip span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}

  .search-row{position:relative;margin-bottom:14px;}
  .search-row svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .search-row input{
    width:100%;border:1px solid var(--border);background:var(--card);border-radius:12px;
    padding:10px 12px 10px 36px;font-size:14px;font-family:inherit;color:var(--text);
  }
  .search-row input:focus{outline:none;border-color:var(--accent);}

  .table-scroll{
    flex:1;overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--card);
    -webkit-overflow-scrolling:touch;
  }
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th,td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--border);}
  th{
    position:sticky;top:0;background:var(--card);z-index:2;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.4px;color:var(--muted);font-weight:700;
  }
  td.name-cell, th.name-th{
    position:sticky;left:0;background:var(--card);text-align:left;z-index:1;
    box-shadow:1px 0 0 var(--border);font-weight:600;
  }
  th.name-th{z-index:3;}
  tbody tr:last-child td{border-bottom:none;}

  .mark-btn{
    border:none;background:var(--bg);border-radius:8px;padding:6px 8px;min-width:38px;
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .mark-btn.pass{background:var(--pass-soft);color:var(--pass);}
  .mark-btn.fail{background:var(--fail-soft);color:var(--fail);}
  .mark-btn.empty{background:var(--bg);color:var(--muted);font-weight:500;}
  .mark-input{
    width:44px;border:1.5px solid var(--accent);border-radius:8px;padding:5px 4px;
    font-family:inherit;font-size:13px;text-align:center;font-weight:700;color:var(--text);
  }
  .mark-input:focus{outline:none;}
  .avg-cell{font-weight:800;}

  .hint{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;}

  .footer-nav{margin-top:auto;padding-top:24px;text-align:center;flex-shrink:0;}
  .footer-nav a{color:var(--muted);font-size:12.5px;text-decoration:none;margin:0 8px;}
  .footer-nav a:hover{text-decoration:underline;}

  svg{display:block;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back-btn" id="topBack" href="schoolbag-dashboard-lecturer.html" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-text">
      <div class="topbar-title" id="topTitle">Gradebook</div>
      <div class="topbar-sub" id="topSub">3 classes &middot; 27 students</div>
    </div>
  </div>

  <div class="class-list" id="classList"></div>

  <div class="detail" id="detailView">
    <div class="stat-row">
      <div class="stat-chip"><strong id="statAverage">–</strong><span>Class average</span></div>
      <div class="stat-chip"><strong id="statGraded">0/0</strong><span>Marks entered</span></div>
      <div class="stat-chip"><strong id="statStudents">0</strong><span>Students</span></div>
    </div>

    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
      <input type="text" id="searchInput" placeholder="Search students…">
    </div>

    <div class="table-scroll">
      <table id="gradeTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="hint">Tap a mark to edit it &middot; percentages out of 100</div>
  </div>

  <div class="footer-nav" id="footerNav">
    <a href="schoolbag-dashboard-lecturer.html">Dashboard</a>&middot;
    <a href="schoolbag-terms.html">Terms</a>&middot;
    <a href="schoolbag-privacy.html">Privacy</a>
  </div>

</div>

<script>
(function(){
  var CLASSES = [
    {
      id: 'materials-l2',
      name: 'Materials L2',
      subject: 'Civil Engineering · NATED',
      initials: 'ML',
      assignments: [
        { id: 'a1', name: 'Assignment 1' },
        { id: 'a2', name: 'Assignment 2' },
        { id: 'a3', name: 'Assignment 3' },
        { id: 'mid', name: 'Mid-term Test' }
      ],
      students: [
        { id: 's1', name: 'Thabo Nkosi',      marks: { a1: 78, a2: 65, a3: 71, mid: 68 } },
        { id: 's2', name: 'Sipho Dlamini',     marks: { a1: 54, a2: 48, a3: null, mid: 60 } },
        { id: 's3', name: 'Zanele Khumalo',    marks: { a1: 91, a2: 88, a3: 85, mid: 92 } },
        { id: 's4', name: 'Nomvula Mahlangu',  marks: { a1: 62, a2: 59, a3: null, mid: 55 } },
        { id: 's5', name: 'Kagiso Molefe',     marks: { a1: 45, a2: 39, a3: null, mid: 41 } },
        { id: 's6', name: 'Precious Ndlovu',   marks: { a1: 83, a2: 79, a3: 80, mid: 76 } },
        { id: 's7', name: 'Bongani Zulu',      marks: { a1: 70, a2: 66, a3: null, mid: 64 } },
        { id: 's8', name: 'Lerato Sithole',    marks: { a1: 58, a2: 61, a3: 57, mid: 50 } },
        { id: 's9', name: 'Amahle Mokoena',    marks: { a1: 88, a2: 90, a3: null, mid: 85 } },
        { id: 's10', name: 'Tumi Radebe',      marks: { a1: 67, a2: 63, a3: 69, mid: 58 } }
      ]
    },
    {
      id: 'civil-n2',
      name: 'Civil Engineering N2',
      subject: 'NCV · Construction',
      initials: 'CE',
      assignments: [
        { id: 'a1', name: 'Assignment 1' },
        { id: 'a2', name: 'Assignment 2' },
        { id: 'prac', name: 'Practical Test' }
      ],
      students: [
        { id: 's1', name: 'Werner Botha',          marks: { a1: 72, a2: 68, prac: 75 } },
        { id: 's2', name: 'Farhana Ismail',         marks: { a1: 90, a2: 86, prac: null } },
        { id: 's3', name: 'Johan van der Merwe',    marks: { a1: 55, a2: 49, prac: 52 } },
        { id: 's4', name: 'Refilwe Mabaso',         marks: { a1: 63, a2: 67, prac: null } },
        { id: 's5', name: 'Andile Cele',            marks: { a1: 41, a2: 38, prac: 44 } },
        { id: 's6', name: 'Rudzani Netshifhefhe',   marks: { a1: 79, a2: 82, prac: 80 } },
        { id: 's7', name: 'Sizwe Buthelezi',        marks: { a1: 68, a2: null, prac: null } },
        { id: 's8', name: 'Christo Pretorius',      marks: { a1: 84, a2: 81, prac: 87 } }
      ]
    },
    {
      id: 'electrical-n2',
      name: 'Electrical N2',
      subject: 'NCV · Electrical Infrastructure',
      initials: 'EL',
      assignments: [
        { id: 'a1', name: 'Assignment 1' },
        { id: 'a2', name: 'Assignment 2' },
        { id: 'a3', name: 'Assignment 3' }
      ],
      students: [
        { id: 's1', name: 'Ayesha Patel',       marks: { a1: 86, a2: 89, a3: null } },
        { id: 's2', name: 'Kabelo Tshabalala',  marks: { a1: 59, a2: 55, a3: 61 } },
        { id: 's3', name: 'Nasreen Ally',       marks: { a1: 73, a2: 70, a3: null } },
        { id: 's4', name: 'Sibusiso Ngcobo',    marks: { a1: 48, a2: 44, a3: 50 } },
        { id: 's5', name: 'Charmaine Adams',    marks: { a1: 92, a2: 95, a3: 90 } },
        { id: 's6', name: 'Zola Ntuli',         marks: { a1: 65, a2: null, a3: null } },
        { id: 's7', name: 'Kefilwe Motaung',    marks: { a1: 77, a2: 74, a3: 79 } },
        { id: 's8', name: 'Yusuf Mahomed',      marks: { a1: 53, a2: 57, a3: null } },
        { id: 's9', name: 'Palesa Moloi',       marks: { a1: 81, a2: 78, a3: 83 } }
      ]
    }
  ];

  var STORAGE_KEY = 'schoolbag_gradebook_marks_v1';

  function loadOverrides(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveOverrides(overrides){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides)); }
    catch (e) { /* storage unavailable — edits just won't persist */ }
  }

  var overrides = loadOverrides(); // { classId: { studentId: { assignmentId: number|null } } }

  function getMark(cls, student, assignmentId){
    var o = overrides[cls.id] && overrides[cls.id][student.id];
    if (o && Object.prototype.hasOwnProperty.call(o, assignmentId)) return o[assignmentId];
    return student.marks[assignmentId];
  }
  function setMark(cls, student, assignmentId, value){
    if (!overrides[cls.id]) overrides[cls.id] = {};
    if (!overrides[cls.id][student.id]) overrides[cls.id][student.id] = {};
    overrides[cls.id][student.id][assignmentId] = value;
    saveOverrides(overrides);
  }

  function studentAvg(cls, student){
    var vals = cls.assignments
      .map(function(a){ return getMark(cls, student, a.id); })
      .filter(function(v){ return typeof v === 'number'; });
    if (!vals.length) return null;
    return Math.round(vals.reduce(function(s, v){ return s + v; }, 0) / vals.length);
  }

  function classStats(cls){
    var total = 0, filled = 0, sum = 0;
    cls.students.forEach(function(student){
      cls.assignments.forEach(function(a){
        total += 1;
        var v = getMark(cls, student, a.id);
        if (typeof v === 'number') { filled += 1; sum += v; }
      });
    });
    return {
      total: total,
      filled: filled,
      average: filled ? Math.round(sum / filled) : null
    };
  }

  var classListEl = document.getElementById('classList');
  var detailView = document.getElementById('detailView');
  var footerNav = document.getElementById('footerNav');
  var topTitle = document.getElementById('topTitle');
  var topSub = document.getElementById('topSub');
  var topBack = document.getElementById('topBack');

  function renderClassList(){
    classListEl.innerHTML = '';
    CLASSES.forEach(function(cls){
      var stats = classStats(cls);
      var pending = stats.total - stats.filled;

      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'class-card';
      card.innerHTML =
        '<div class="class-icon">' + cls.initials + '</div>' +
        '<div class="class-info">' +
          '<div class="class-title">' + cls.name + '</div>' +
          '<div class="class-meta">' + cls.subject + ' &middot; ' + cls.students.length + ' students</div>' +
        '</div>' +
        (pending > 0
          ? '<span class="ungraded-badge">' + pending + ' to grade</span>'
          : '<span class="ungraded-badge clear">All graded</span>') +
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
      card.addEventListener('click', function(){ openClass(cls); });
      classListEl.appendChild(card);
    });
  }

  var currentClass = null;
  var searchInput = document.getElementById('searchInput');
  var statAverage = document.getElementById('statAverage');
  var statGraded = document.getElementById('statGraded');
  var statStudents = document.getElementById('statStudents');
  var tableHead = document.getElementById('tableHead');
  var tableBody = document.getElementById('tableBody');

  function openClass(cls){
    currentClass = cls;
    searchInput.value = '';
    showView('detail');
    renderDetail();
  }

  function renderDetail(){
    var cls = currentClass;
    var stats = classStats(cls);

    topTitle.textContent = cls.name;
    topSub.textContent = cls.subject;
    statAverage.textContent = stats.average === null ? '–' : stats.average + '%';
    statGraded.textContent = stats.filled + '/' + stats.total;
    statStudents.textContent = cls.students.length;

    // header row
    tableHead.innerHTML = '<th class="name-th">Student</th>' +
      cls.assignments.map(function(a){ return '<th>' + a.name + '</th>'; }).join('') +
      '<th>Avg</th>';

    var query = searchInput.value.trim().toLowerCase();
    var visible = cls.students.filter(function(s){
      return s.name.toLowerCase().indexOf(query) !== -1;
    });

    tableBody.innerHTML = '';
    visible.forEach(function(student){
      var tr = document.createElement('tr');

      var nameTd = document.createElement('td');
      nameTd.className = 'name-cell';
      nameTd.textContent = student.name;
      tr.appendChild(nameTd);

      cls.assignments.forEach(function(a){
        var td = document.createElement('td');
        td.appendChild(makeMarkButton(cls, student, a.id));
        tr.appendChild(td);
      });

      var avgTd = document.createElement('td');
      avgTd.className = 'avg-cell';
      var avg = studentAvg(cls, student);
      avgTd.textContent = avg === null ? '–' : avg + '%';
      tr.appendChild(avgTd);

      tableBody.appendChild(tr);
    });
  }

  function makeMarkButton(cls, student, assignmentId){
    var val = getMark(cls, student, assignmentId);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mark-btn ' + (val === null || val === undefined ? 'empty' : (val >= 50 ? 'pass' : 'fail'));
    btn.textContent = (val === null || val === undefined) ? '–' : val;
    btn.addEventListener('click', function(){ editMark(btn, cls, student, assignmentId, val); });
    return btn;
  }

  function editMark(btn, cls, student, assignmentId, currentVal){
    var input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.max = '100';
    input.className = 'mark-input';
    input.value = (currentVal === null || currentVal === undefined) ? '' : currentVal;
    btn.replaceWith(input);
    input.focus();
    input.select();

    function commit(){
      var raw = input.value.trim();
      var newVal = raw === '' ? null : Math.max(0, Math.min(100, Math.round(Number(raw))));
      if (raw !== '' && isNaN(Number(raw))) newVal = currentVal;
      setMark(cls, student, assignmentId, newVal);
      renderDetail();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = (currentVal === null || currentVal === undefined) ? '' : currentVal; input.blur(); }
    });
  }

  searchInput.addEventListener('input', renderDetail);

  function showView(name){
    classListEl.classList.toggle('hidden', name !== 'list');
    detailView.classList.toggle('active', name === 'detail');
    footerNav.style.display = name === 'list' ? '' : 'none';

    if (name === 'list') {
      topTitle.textContent = 'Gradebook';
      var totalStudents = CLASSES.reduce(function(sum, c){ return sum + c.students.length; }, 0);
      topSub.textContent = CLASSES.length + ' classes · ' + totalStudents + ' students';
      topBack.setAttribute('href', 'schoolbag-dashboard-lecturer.html');
      topBack.onclick = null;
      renderClassList();
    } else {
      topBack.setAttribute('href', '#');
      topBack.onclick = function(e){ e.preventDefault(); showView('list'); };
    }
  }

  showView('list');
})();
</script>

</body>
</html>
